<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | GitHub Issues Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>

</head>

<body>
    <nav class="navbar bg-base-100 shadow-lg w-[95%] mx-auto rounded-lg flex flex-col md:flex-row items-center justify-between p-4 gap-4">
        <div class="logo flex items-center gap-3">
            <img class="h-8 w-8 md:h-9 md:w-9" src="./assets/github-logo.png" alt="GitHub Logo">
            <h1 class="text-xl md:text-2xl font-semibold">GitHub Issues Tracker</h1>
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto">
            <div class="relative w-full">
                <i class="fa-brands fa-sistrix absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" placeholder="Search issues..."
                    class="input input-bordered pl-10 text-[16px] w-full md:max-w-xs outline-none" />
            </div>
            <button id="search-btn" class="btn btn-primary">Search</button>
        </div>
    </nav>

    <div class="main w-[95%] lg:w-9/12 xl:w-8/12 mt-10 md:mt-14 mx-auto px-2">
        
        <div class="tab flex items-center justify-start gap-2 md:gap-4 overflow-x-auto pb-2 no-scrollbar">
            <button class="btn btn-primary btn-sm md:btn-md min-w-[100px]">All</button>
            <button class="btn btn-sm md:btn-md min-w-[100px]">Open</button>
            <button class="btn btn-sm md:btn-md min-w-[100px]">Closed</button>
        </div>

        <div class="mt-8 md:mt-12 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
            <div class="left flex items-center gap-4">
                <img src="./assets/Aperture.png" class="w-10 h-10 md:w-auto" alt="">
                <div>
                    <p class="text-xl md:text-2xl font-bold"><span id="all-count">0</span> Issues</p>
                    <p class="text-sm md:text-base text-gray-500">Track and manage your project issues</p>
                </div>
            </div>

            <div class="right flex items-center gap-5 md:gap-7">
                <div class="flex items-center">
                    <div class="w-3 h-3 bg-[#00A96E] rounded-full"></div>
                    <span class="ml-2 text-sm font-medium">Open</span>
                </div>
                <div class="flex items-center">
                    <div class="w-3 h-3 bg-[#A855F7] rounded-full"></div>
                    <span class="ml-2 text-sm font-medium">Closed</span>
                </div>
            </div>
        </div>

        <div id="issues-container" class="issues mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 min-h-[200px] relative">
            </div>
    </div>

    <input type="checkbox" id="issue-modal" class="modal-toggle" />
    <div class="modal" role="dialog">
        <div class="modal-box w-[95%] max-w-2xl p-6 md:p-8 rounded-2xl relative">
            <h3 id="modal-title" class="text-2xl md:text-3xl font-bold text-gray-800"></h3>
            <div class="modal-action">
                <label for="issue-modal" class="btn btn-primary w-full md:w-auto">Close</label>
            </div>
        </div>
        <label class="modal-backdrop" for="issue-modal">Close</label>
    </div>

    <script src="home.js"></script>
</body>

</html>
