<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | GitHub Issues Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>

</head>

<body>

    <!----------------------------- Navbar ----------------------------->

    <nav class="navbar bg-base-100 shadow-lg w-[95%] mx-auto rounded-lg flex items-center justify-between">
        <div class="logo flex items-center gap-3 p-4">
            <img class="h-9 w-9" src="./assets/github-logo.png" alt="GitHub Logo">
            <h1 class="text-2xl font-semibold">GitHub Issues Tracker</h1>
        </div>

        <div class="flex items-center justify-between gap-4">
            <i class="fa-brands fa-sistrix"></i>
            <input type="text" placeholder="Search issues..." class="input border-0 text-[16px] outline-none w-full max-w-xs" />
            <button class="btn btn-primary"><i class="fa-solid fa-plus"></i>New Issue</button>
        </div>
    </nav>

    <!----------------------------- Main Content ----------------------------->

    <div class="main w-8/12 mt-14 mx-auto">
        <div class="tab mt-14 p-5 flex items-center justify-start gap-4">
            <button class="btn btn-primary w-[120px]">All</button>
            <button class="btn w-[120px]">Open</button>
            <button class="btn w-[120px]">Closed</button>
        </div>
    </div>
    
</body>

</html>
